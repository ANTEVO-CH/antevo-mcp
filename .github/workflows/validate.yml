name: validate

# The whole repository is JSON that other people's marketplaces parse. A trailing
# comma here is a rejected listing there, so parse every file on every push.
on:
  push:
  pull_request:

jobs:
  json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse every JSON file
        run: |
          fail=0
          while IFS= read -r f; do
            if python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f"; then
              echo "ok   $f"
            else
              echo "FAIL $f"; fail=1
            fi
          done < <(find . -name '*.json' -not -path './.git/*')
          exit $fail

      # Cursor's own validator, fetched from cursor/plugin-template, run against
      # this repo. The layout is theirs, not ours: .cursor-plugin/marketplace.json
      # enumerates plugins[], each with its own plugins/<name>/.cursor-plugin/
      # plugin.json and mcp.json. The first version of this repo guessed — a
      # single root plugin.json with mcpServers inline — and would have been
      # rejected, and would have yielded ONE listing instead of three. Run the
      # real thing rather than guess again.
      - name: Cursor marketplace layout
        run: |
          curl -sS -o /tmp/validate-template.mjs \
            https://raw.githubusercontent.com/cursor/plugin-template/main/scripts/validate-template.mjs
          node /tmp/validate-template.mjs

      # Kiro reads powers/<name>/ in the Agent Plugins format, not Cursor's. Its
      # schemas are closed (unknown keys fail) and a remote server needs an
      # explicit "type", so validate against the published schemas themselves.
      - name: Kiro powers match the Agent Plugins schemas
        run: |
          pip install --quiet jsonschema
          for f in plugin mcp; do
            curl -sSf -o /tmp/$f.schema.json https://agent-plugins.org/schemas/1.0.0/$f.schema.json
          done
          python3 - <<'PY'
          import glob, json, sys, jsonschema
          schemas = {f: json.load(open(f"/tmp/{f}.schema.json")) for f in ("plugin", "mcp")}
          bad = 0
          for path in sorted(glob.glob("powers/*/*.json")):
              kind = "plugin" if path.endswith("plugin.json") else "mcp"
              try:
                  jsonschema.Draft202012Validator(schemas[kind]).validate(json.load(open(path)))
                  print(f"ok   {path}")
              except jsonschema.ValidationError as e:
                  print(f"FAIL {path}: {e.message}"); bad = 1
          sys.exit(bad)
          PY

      - name: Registry manifests must match what is published
        run: |
          # These files are a mirror. If they drift from the live registry, the
          # repository is quietly advertising something that is not true.
          curl -sS "https://registry.modelcontextprotocol.io/v0/servers?search=antevo" -o /tmp/live.json
          python3 - <<'PY'
          import json, glob, sys
          # A search returns every published version; compare against the one the
          # registry marks latest, or a stale 1.0.0 can shadow the current 1.0.1.
          live = {}
          for s in json.load(open("/tmp/live.json"))["servers"]:
              meta = s.get("_meta", {}).get("io.modelcontextprotocol.registry/official", {})
              if meta.get("isLatest", True):
                  live[s["server"]["name"]] = s["server"]
          bad = 0
          for path in sorted(glob.glob("registry/*/server.json")):
              local = json.load(open(path))
              name = local["name"]
              if name not in live:
                  print(f"FAIL {path}: {name} is not in the live registry"); bad = 1; continue
              for field in ("version", "remotes"):
                  if local.get(field) != live[name].get(field):
                      print(f"FAIL {path}: {field} differs from the published entry")
                      print(f"      local={local.get(field)}")
                      print(f"      live ={live[name].get(field)}")
                      bad = 1
              if not bad:
                  print(f"ok   {path} matches {name} v{live[name]['version']}")
          sys.exit(bad)
          PY
